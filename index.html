<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal universitario</title><style>body{margin:0;background:#fff5f8;color:#654354;font:16px Arial}header{background:#d88ca5;color:#35202b;padding:26px;text-align:center}main{max-width:900px;margin:24px auto;padding:24px;background:white;border:1px solid #f3c6d5;border-radius:12px}input,button,select{font:inherit;padding:10px;margin:5px;border:1px solid #d88ca5;border-radius:6px}button{background:#f3c6d5;color:#4d2939;cursor:pointer}label{display:block}pre{white-space:pre-wrap;background:#fff5f8;padding:16px}section{margin:16px 0}h1{margin:0}small{display:block;margin:8px}</style><header><h1>Portal universitario</h1><small>Ingeniería de Software · Tarea 10</small></header><main><section id="login"><h2>Iniciar sesión</h2><label>Código <input id="codigo" value="A001"></label><label>Contraseña <input id="clave" type="password" value="Demo1234"></label><button onclick="entrar()">Ingresar</button><small>Demo: A001 estudiante, D001 docente, P001 administrativo, S001 administrador. Contraseña Demo1234.</small></section><section id="panel" hidden><h2 id="bienvenida"></h2><div id="acciones"></div><div id="formulario"></div><button onclick="location.reload()">Salir</button></section><h3>Resultado</h3><pre id="salida" aria-live="polite">Esperando operación.</pre></main><script>let token='';const $=id=>document.getElementById(id);async function api(path,method='GET',data){try{let r=await fetch(path,{method,headers:{'Content-Type':'application/json','Authorization':token},body:data?JSON.stringify(data):undefined});let j=await r.json();$('salida').textContent=JSON.stringify(j,null,2);return r.ok?j:null}catch(e){$('salida').textContent='Error de conexión: '+e;return null}}async function entrar(){let u=await api('/login','POST',{codigo:$('codigo').value,clave:$('clave').value});if(!u)return;token=u.token;$('salida').textContent='Sesión iniciada';$('login').hidden=true;$('panel').hidden=false;$('bienvenida').textContent=u.nombre+' | '+u.rol;let a=$('acciones');let opciones=u.rol==='estudiante'?[['Materias','/materias'],['Calificaciones','/calificaciones'],['Adeudos','/adeudos'],['Solicitudes','/solicitudes']]:u.rol==='docente'?[['Grupos','/grupos'],['Reportes','/reportes']]:[['Reportes','/reportes']];for(let [nombre,ruta] of opciones){let b=document.createElement('button');b.textContent=nombre;b.onclick=()=>api(ruta);a.append(b)}let f=$('formulario');if(u.rol==='estudiante'){f.innerHTML='<h3>Solicitar constancia</h3><input id="tipo" value="Constancia de estudios"><button onclick="api(\'/solicitudes\',\'POST\',{tipo:$(\'tipo\').value})">Solicitar</button>'}else if(u.rol==='docente'){f.innerHTML='<h3>Registrar calificación</h3><input id="alumno" value="A001"><input id="materia" value="Ingeniería de Software"><input id="nota" type="number" value="95"><button onclick="api(\'/calificaciones\',\'PUT\',{alumno:$(\'alumno\').value,materia:$(\'materia\').value,nota:Number($(\'nota\').value)})">Guardar</button>'}else{f.innerHTML='<h3>Registrar estudiante</h3><input id="nuevo" placeholder="Código"><input id="nombre" placeholder="Nombre"><input id="password" type="password" placeholder="Contraseña"><button onclick="api(\'/estudiantes\',\'POST\',{codigo:$(\'nuevo\').value,nombre:$(\'nombre\').value,clave:$(\'password\').value})">Registrar</button>'}}</script></html>
